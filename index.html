<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Silly Story Generator</title>
    <style>
        body {
            font-family: 'Regular 400 Italic', cursive, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #dcd7cf, #e49074);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 2.5 rem;
            color: #c90b41;
            text-shadow: 2px 2px #ae838a;
            margin-bottom: 20px;
        }

        .input-group {
            background: rgb(237, 234, 234);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }

        label {
            font-size: 1.2rem;
            color: #1e1c1c;
            margin-right: 10px;
        }

        input {
            padding: 10px;
            border: 2px solid #ff0048;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            width: 200px;
        }

        input:focus {
            border-color: #7d705d;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 1.1rem;
            background: linear-gradient(45deg, #c1758b, #cdba9f);
            color: rgb(156, 28, 28);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
        }

        .story {
            background: rgb(61, 56, 56);
            padding: 20px;
            margin-top: 30px;
            border-radius: 15px;
            max-width: 500px;
            line-height: 1.5;
            box-shadow: 0 4px 15px rgba(152, 142, 142, 0.1);
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <h1> Silly Story Generator </h1>

    <div class="input-group">
        <label for="customname">Enter name:</label>
        <input type="text" id="customname" placeholder="e.g. Alex Periera">
        <br>
        <button class="randomize">Generate Story</button>
    </div>

    <div class="story"></div>

    <script src="script.js"></script>
</body>

</html>
